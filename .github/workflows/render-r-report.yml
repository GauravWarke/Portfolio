name: Render R report

on:
  push:
    branches: [main]
    paths:
      - "analysis/**"
      - "data/**"
      - ".github/workflows/render-r-report.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::ggplot2
            any::scales
            any::jsonlite
            any::knitr
            any::rmarkdown

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render ggplot2 figures
        run: Rscript analysis/figures.R

      - name: Render Quarto report
        run: quarto render analysis/report.qmd

      - name: Commit rendered report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f analysis/report.html analysis/figures
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Render R report [skip ci]"
            git push
          fi
