name: Render R report

on:
  push:
    branches: [main]
    # Anything that can change a published figure, or the checks that guard one,
    # has to trigger this workflow. Listing only the chart script left the
    # parsers, the readers they depend on, and the tests themselves ungated:
    # a parser could regress, or a test could be broken, without CI ever running.
    paths:
      - "analysis/**"
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/render-r-report.yml"
  # Publishers issue new releases without notice. A weekly run makes staleness
  # show up as a failing check rather than as figures that quietly age.
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::ggplot2
            any::scales
            any::tidyr
            any::jsonlite
            any::knitr
            any::rmarkdown

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render ggplot2 figures (R)
        run: Rscript analysis/figures.R

      - name: Run the survival model (R)
        run: Rscript analysis/survival_model.R

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib pytest

      - name: Test data integrity
        run: python -m pytest tests/ -v

      # Reports a publisher release newer than the one we pin. Only enforced on
      # the scheduled run: a push should not fail because ABS published
      # something unrelated to the change being made.
      - name: Check for newer source releases
        if: github.event_name == 'schedule'
        run: python scripts/check_freshness.py

      - name: Check for newer source releases (advisory)
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: python scripts/check_freshness.py

      - name: Render matplotlib figures (Python)
        run: python scripts/make_charts.py

      - name: Render Quarto report
        run: quarto render analysis/report.qmd

      - name: Commit rendered charts and report
        run: |
          git config user.name "Gaurav Warke"
          git config user.email "gauravwarke8@gmail.com"
          git add -f analysis/report.html assets/charts
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Render R + Python charts and report [skip ci]"
            git push
          fi
